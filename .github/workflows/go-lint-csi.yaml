# Always run basic Golang linting
name: CSI - Go Lint

on:
  push:
    paths-ignore:
      - README.md
      - .github/dependabot.yml
      - .github/workflows/**
      - docs/
      - examples/
      - deploy/
      - hack/
      - charts/
      - operator/
  pull_request:
    paths-ignore:
      - README.md
      - .github/dependabot.yml
      - .github/workflows/**
      - docs/
      - examples/
      - deploy/
      - hack/
      - charts/
      - operator/

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint:
    name: Run CSI Golang Linting
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
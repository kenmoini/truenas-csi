# Always run basic Golang tests
name: Operator - Go Tests

on:
  push:
    paths-ignore:
      - README.md
      - .github/dependabot.yml
      - .github/workflows/**
      - docs/
      - examples/
      - deploy/
      - hack/
      - charts/
      - pkg/
      - test/
  # Disable pull_request to prevent malicious PRs
  # pull_request:
  #   paths-ignore:
  #     - README.md
  #     - DEV.md
  #     - RELEASE.md
  #     - .github/dependabot.yml
  #     - .github/workflows/**
  #     - .devcontainer/**

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  test-operator:
    name: Run Operator Golang Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: go-test

      - name: Verify kind installation
        run: kind version

      - name: Running Tests
        run: |
          cd operator
          go mod tidy
          make test
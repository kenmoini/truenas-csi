version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    labels:
      - dependencies
      - github_actions

  # General Runtime Scans
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    labels:
      - dependencies
      - csi
      - go

  - package-ecosystem: "gomod"
    directory: "/operator"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    labels:
      - dependencies
      - operator
      - go

  # Docker updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    labels:
      - dependencies
      - csi
      - docker

  - package-ecosystem: "docker"
    directory: "/operator"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    labels:
      - dependencies
      - operator
      - docker
